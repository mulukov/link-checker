<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Антифишинг</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f4f4;
            font-family: Arial;
        }
        .block {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div class="block">
    <h1>🛡️ Проверка ссылок</h1>
    <p>Вставь ссылку и нажми "Проверить"</p>

    <input id="link" placeholder="https://google.com" style="width:300px;padding:10px;">
    <button onclick="check()">Проверить</button>

    <p id="result" style="font-size:24px;font-weight:bold;"></p>
</div>

<script>
    function check() {
        let url = document.getElementById('link').value;
        let result = document.getElementById('result');

        let danger = false;
        let signs = ['free', 'gift', 'login', 'verify', 'bank', '.tk', '.ml', '.ga', '.top', '.xyz'];

        for (let sign of signs) {
            if (url.includes(sign)) {
                danger = true;
            }
        }

        if (url.startsWith('http://') && (url.includes('login') || url.includes('password'))) {
            danger = true;
        }

        if (danger) {
            result.innerHTML = '⚠️ ОСТОРОЖНО!';
            result.style.color = 'red';
        } else {
            result.innerHTML = '✅ БЕЗОПАСНО';
            result.style.color = 'green';
        }
    }
</script>

</body>
</html>
